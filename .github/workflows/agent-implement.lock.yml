inkwrap.json\",\"requirements.txt\",\"Pipfile\",\"Pipfile.lock\",\"pyproject.toml\",\"setup.py\",\"setup.cfg\",\"Gemfile\",\"Gemfile.lock\",\"uv.lock\",\"CODEOWNERS\",\"DESIGN.md\",\"README.md\",\"CONTRIBUTING.md\",\"CHANGELOG.md\",\"SECURITY.md\",\"CODE_OF_CONDUCT.md\",\"CLAUDE.md\",\"AGENTS.md\"],\"signed_commits\":false,\"target\":\"*\",\"title_prefix\":\"[bot] \"},\"report_incomplete\":{}}"
          GH_AW_INPUT_ISSUE_NUMBER: ${{ inputs.issue-number }}
