.lock\",\"pyproject.toml\",\"setup.py\",\"setup.cfg\",\"Gemfile\",\"Gemfile.lock\",\"uv.lock\",\"CODEOWNERS\",\"DESIGN.md\",\"README.md\",\"CONTRIBUTING.md\",\"SECURITY.md\",\"CODE_OF_CONDUCT.md\",\"CLAUDE.md\",\"AGENTS.md\"],\"protected_files_policy\":\"request-review\",\"signed_commits\":false,\"target\":\"*\",\"title_prefix\":\"[bot] \"},\"report_incomplete\":{},\"report_missing_data\":{},\"report_missing_tool\":{}}"
          GH_AW_INPUT_ISSUE_NUMBER: ${{ inputs.issue-number }}
