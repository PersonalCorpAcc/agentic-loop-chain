            /tmp/gh-aw/agent/harness_retry.json
            /tmp/gh-aw/pre-agent-audit.txt
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/otel.jsonl
            ${{ env.GH_AW_OTEL_METRICS == 'true' && '/tmp/gh-aw/otel-metrics.jsonl' || '' }}
            /tmp/gh-aw/otlp-export-errors.jsonl
            /tmp/gh-aw/safeoutputs.jsonl
            /tmp/gh-aw/aw-*.patch
            /tmp/gh-aw/aw-*.bundle
            /tmp/gh-aw/agent_output.json
            /tmp/gh-aw/aw-*.patch
            /tmp/gh-aw/aw-*.bundle
            /tmp/gh-aw/awf-config.json
            /tmp/gh-aw/awf-resolved-config.json
            /tmp/gh-aw/sandbox/firewall/logs/
            /tmp/gh-aw/sandbox/firewall/audit/
            /tmp/gh-aw/sandbox/firewall/awf-reflect.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}

  conclude:
    name: conclude
    needs:
      - activation
      - agent
      - reserve
      - safe_outputs
    if: >
      always() && needs.agent.result == 'success' && needs.safe_outputs.result == 'success'
    runs-on: ubuntu-24.04
    # Permissions for the conclude job (workflow permissions default to none).
    permissions:
      # To read the agent job's log, where the kit's outcome line is when the agent did not
      # repeat it in its structured output.
      actions: read
      contents: read
      issues: write # Create or update issues and comments.
      pull-requests: write # Create or update pull requests and review comments.
    steps:
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          owner: ${{ github.repository_owner }}
          permission-actions: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Remove bot-working label
        uses: ./.github/actions/remove-issue-labels
        with:
          issue-number: ${{ inputs.issue-number }}
          labels: ${{ env.WORKING_LABEL }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Check the created pull request
        if: needs.safe_outputs.outputs.created_pr_number != ''
        uses: ./.github/actions/verify-created-pull-request
        with:
          base-tip: ${{ needs.reserve.outputs.base_tip }}
          branch-point-tip: ${{ needs.reserve.outputs.branch_point_tip }}
          pr-number: ${{ needs.safe_outputs.outputs.created_pr_number }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Hand the issue to a human when the pull request is wrong
        if: failure() && needs.safe_outputs.outputs.created_pr_number != ''
        uses: ./.github/actions/add-issue-labels
        with:
          issue-number: ${{ inputs.issue-number }}
          labels: ${{ env.REVIEW_LABEL }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Check the pull request says what was tested
        if: needs.safe_outputs.outputs.created_pr_number != ''
        run: bash ./.github/actions/check-pr-verification/check-pr-verification.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.safe_outputs.outputs.created_pr_number }}
      - name: Verify PR closes the source issue
        if: needs.safe_outputs.outputs.created_pr_number != ''
        uses: ./.github/actions/link-pr-to-issue
        with:
          issue-number: ${{ inputs.issue-number }}
          pr-number: ${{ needs.safe_outputs.outputs.created_pr_number }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Read the branch the pull request was opened from
        id: change-branch
        if: needs.safe_outputs.outputs.created_pr_number != ''
        run: |
          set -euo pipefail
          branch=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName --jq '.headRefName')
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ needs.safe_outputs.outputs.created_pr_number }}
          REPO: ${{ github.repository }}
      - name: Record the pull request and branch on the issue
        if: needs.safe_outputs.outputs.created_pr_number != ''
        uses: ./.github/actions/record-change-linkage
        with:
          body: |
            Implementation opened as #${{ needs.safe_outputs.outputs.created_pr_number }} on branch `${{ steps.change-branch.outputs.branch }}`.

            <!-- implement-pr: ${{ needs.safe_outputs.outputs.created_pr_number }} -->
            <!-- implement-branch: ${{ steps.change-branch.outputs.branch }} -->
          issue-number: ${{ inputs.issue-number }}
          marker-key: implement-pr
          token: ${{ steps.app-token.outputs.token }}
      - name: Mark issue as having a pull request pending
        if: needs.safe_outputs.outputs.created_pr_number != ''
        uses: ./.github/actions/add-issue-labels
        with:
          issue-number: ${{ inputs.issue-number }}
          labels: ${{ env.PR_PENDING_LABEL }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Reconcile the new bot pull request
        if: needs.safe_outputs.outputs.created_pr_number != ''
        run: |
          set -euo pipefail
          # GitHub may create the pending CI run shortly after the PR appears.
          sleep 60
          gh workflow run work-router.yml --repo "$REPO" --ref "$REF" \
            -f operation=reconcile-bot-pr-runs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REF: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
      - name: Download the agent's structured output
        id: agent-output
        if: needs.safe_outputs.outputs.created_pr_number == ''
        uses: ./.github/actions/download-agent-output
        with:
          artifact-name: ${{ needs.activation.outputs.artifact_prefix }}agent
        continue-on-error: true
      - name: Read the pipeline's outcome line
        id: pipeline
        if: needs.safe_outputs.outputs.created_pr_number == ''
        run: bash ./.github/actions/read-implement-outcome/read-implement-outcome.sh
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_FILE: ${{ steps.agent-output.outputs.output-file }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
      - name: Say why no pull request was opened
        if: steps.pipeline.outputs.declined == 'true'
        uses: ./.github/actions/create-issue-comment
        with:
          body: |
            <!-- agent-implement-declined -->
            Implementation stopped without a pull request: `${{ steps.pipeline.outputs.outcome }}` in phase `${{ steps.pipeline.outputs.phase }}`, reason `${{ steps.pipeline.outputs.reason }}`. The run's log has the agent's own explanation.

            The issue now carries `${{ env.REVIEW_LABEL }}` instead of `${{ env.IMPLEMENT_LABEL }}`. When whatever stopped it is resolved (a dependency merged, a question answered), add `${{ env.IMPLEMENT_LABEL }}` again to retry.

            [View this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          issue-number: ${{ inputs.issue-number }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Hand the declined issue to a person
        if: steps.pipeline.outputs.declined == 'true'
        uses: ./.github/actions/add-issue-labels
        with:
          issue-number: ${{ inputs.issue-number }}
          labels: ${{ env.REVIEW_LABEL }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Take the declined issue out of the queue
        if: steps.pipeline.outputs.declined == 'true'
        uses: ./.github/actions/remove-issue-labels
        with:
          issue-number: ${{ inputs.issue-number }}
          labels: ${{ env.IMPLEMENT_LABEL }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Record the outcome
        if: always()
        uses: ./.github/actions/record-outcome
        with:
          detail: "${{ needs.safe_outputs.outputs.created_pr_number != '' && format('Opened pull request #{0} for this issue.', needs.safe_outputs.outputs.created_pr_number) || steps.pipeline.outputs.declined == 'true' && format('The pipeline stopped: {0} in phase {1}, reason {2}. No pull request was requested.', steps.pipeline.outputs.outcome, steps.pipeline.outputs.phase, steps.pipeline.outputs.reason) || 'The run produced no pull request for this issue.' }}"
          outcome: ${{ needs.safe_outputs.outputs.created_pr_number != '' && 'acted' || steps.pipeline.outputs.declined == 'true' && 'handed-to-human' || 'no-action' }}
          reason: ${{ needs.safe_outputs.outputs.created_pr_number != '' && 'acted' || steps.pipeline.outputs.declined == 'true' && 'pipeline-declined' || 'no-eligible-change' }}
          route: implement
          subject: "${{ format('#{0}', inputs.issue-number) }}"
      - name: Pick up queued work
        if: always()
        uses: ./.github/actions/pick-up-queued-work
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

  conclusion:
    name: conclusion
    needs:
      - activation
      - agent
      - conclude
      - eligibility
      - hold
      - incomplete
      - reserve
      - safe_outputs
    if: >
      always() && (needs.agent.result != 'skipped' || needs.activation.result == 'failure' || needs.activation.outputs.lockdown_check_failed == 'true' ||
      needs.activation.outputs.oauth_token_check_failed == 'true' || needs.activation.outputs.stale_lock_file_failed == 'true' ||
      needs.activation.outputs.secret_verification_result == 'failed' || needs.activation.outputs.daily_ai_credits_exceeded == 'true' ||
      needs.activation.outputs.daily_ai_credits_guardrail_status == 'structural_error' || needs.activation.outputs.daily_ai_credits_guardrail_status == 'transient_error' ||
      (!cancelled()) && needs.activation.result == 'success' && needs.activation.outputs.daily_ai_credits_guardrail_status != 'quota_blocked' &&
      (needs.eligibility.result == 'failure' || needs.reserve.result == 'failure'))
    runs-on: ubuntu-24.04
    # Permissions for the conclusion job (workflow permissions default to none).
    permissions:
      actions: read # Read workflow runs and artifacts for workflow context.
      contents: write # Create or update repository contents.
      id-token: write # Request an OIDC token for authenticated services.
      issues: write # Create or update issues and comments.
      pull-requests: write # Create or update pull requests and review comments.
    concurrency:
      group: "gh-aw-conclusion-agent-implement"
      cancel-in-progress: false
      queue: max
    env:
      GH_AW_JOB_DISPLAY_NAMES: "{\"activation\":\"activation\",\"agent\":\"agent\",\"conclude\":\"conclude\",\"conclusion\":\"conclusion\",\"eligibility\":\"eligibility\",\"hold\":\"hold\",\"incomplete\":\"incomplete\",\"pre_activation\":\"pre_activation\",\"reserve\":\"reserve\",\"safe_outputs\":\"safe_outputs\"}"
      GH_AW_JOB_RESULTS: "{\"activation\":{\"result\":\"${{ needs.activation.result }}\"},\"agent\":{\"result\":\"${{ needs.agent.result }}\"},\"conclude\":{\"result\":\"${{ needs.conclude.result }}\"},\"eligibility\":{\"result\":\"${{ needs.eligibility.result }}\"},\"hold\":{\"result\":\"${{ needs.hold.result }}\"},\"incomplete\":{\"result\":\"${{ needs.incomplete.result }}\"},\"reserve\":{\"result\":\"${{ needs.reserve.result }}\"},\"safe_outputs\":{\"result\":\"${{ needs.safe_outputs.result }}\"}}"
      GH_AW_JOB_TIMING_ELIGIBLE: "{\"activation\":true,\"agent\":true,\"conclude\":true,\"conclusion\":true,\"eligibility\":true,\"hold\":true,\"incomplete\":true,\"pre_activation\":true,\"reserve\":true,\"safe_outputs\":true}"
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      incomplete_count: ${{ steps.report_incomplete.outputs.incomplete_count }}
      noop_comment_body: ${{ steps.noop.outputs.noop_comment_body }}
      noop_message: ${{ steps.noop.outputs.noop_message }}
      tools_reported: ${{ steps.missing_tool.outputs.tools_reported }}
      total_count: ${{ steps.missing_tool.outputs.total_count }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@dfe97a19c8249d41e2adfc95f92db2b8facea58f # v1.3.1
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Agent: Implement Issue"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/agent-implement.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "2.1.325"
          GH_AW_INFO_AWF_VERSION: "v0.29.14"
          GH_AW_INFO_ENGINE_ID: "claude"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{${{ needs.activation.outputs.artifact_prefix }}agent,${{ needs.activation.outputs.artifact_prefix }}agent-output-fallback}"
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          if [ -f "/tmp/gh-aw/agent_output.json" ]; then
            echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Download workflow metadata
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.activation.outputs.artifact_prefix }}info
          path: /tmp/gh-aw/
      - name: Download Safe Outputs Items Manifest
        id: download-safe-outputs-manifest
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.activation.outputs.artifact_prefix }}safe-outputs-items
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Process no-op messages
        id: noop
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_NOOP_MAX: "2"
          GH_AW_WORKFLOW_NAME: "Agent: Implement Issue"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/agent-implement.md"
          GH_AW_ENGINE_ID: "claude"
          GH_AW_ENGINE_MODEL: "claude-sonnet-5"
          GH_AW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_AW_AGENT_CONCLUSION: ${{ needs.agent.result }}
          GH_AW_NOOP_REPORT_AS_ISSUE: "false"
          GH_AW_AIC: ${{ needs.agent.outputs.aic }}
          GH_AW_AMBIENT_CONTEXT: ${{ needs.agent.outputs.ambient_context }}
          GH_AW_WORKFLOW_ID: "agent-implement"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'handle_noop_message.cjs'));
            await main();
      - name: Record missing tool
        id: missing_tool
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_MISSING_TOOL_CREATE_ISSUE: "true"
          GH_AW_WORKFLOW_NAME: "Agent: Implement Issue"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/agent-implement.md"
          GH_AW_ENGINE_ID: "claude"
          GH_AW_ENGINE_MODEL: "claude-sonnet-5"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'missing_tool.cjs'));
            await main();
      - name: Record incomplete
        id: report_incomplete
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_REPORT_INCOMPLETE_CREATE_ISSUE: "true"
          GH_AW_WORKFLOW_NAME: "Agent: Implement Issue"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/agent-implement.md"
          GH_AW_ENGINE_ID: "claude"
          GH_AW_ENGINE_MODEL: "claude-sonnet-5"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'report_incomplete_handler.cjs'));
            await main();
      - name: Handle agent failure
        id: handle_agent_failure
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_WORKFLOW_NAME: "Agent: Implement Issue"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/agent-implement.md"
          GH_AW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_AW_AGENT_CONCLUSION: ${{ needs.agent.result }}
          GH_AW_ACTIVATION_RESULT: ${{ needs.activation.result }}
          GH_AW_WORKFLOW_ID: "agent-implement"
          GH_AW_ACTION_FAILURE_ISSUE_EXPIRES_HOURS: "0"
          GH_AW_ENGINE_ID: "claude"
          GH_AW_SECRET_VERIFICATION_RESULT: ${{ needs.activation.outputs.secret_verification_result }}
          GH_AW_CHECKOUT_PR_SUCCESS: ${{ needs.agent.outputs.checkout_pr_success }}
          GH_AW_CHECKOUT_PR_INVALIDATED: ${{ needs.agent.outputs.checkout_pr_invalidated }}
          GH_AW_AI_CREDITS_RATE_LIMIT_ERROR: ${{ needs.agent.outputs.ai_credits_rate_limit_error || 'false' }}
          GH_AW_UNKNOWN_MODEL_AI_CREDITS: ${{ needs.agent.outputs.unknown_model_ai_credits || 'false' }}
          GH_AW_AIC: ${{ needs.agent.outputs.aic }}
          GH_AW_MAX_AI_CREDITS: "5000"
          GH_AW_DEFAULT_CHECKOUT_USES_TRIGGER_REF: "true"
          GH_AW_INFERENCE_ACCESS_ERROR: ${{ needs.agent.outputs.inference_access_error }}
          GH_AW_MCP_POLICY_ERROR: ${{ needs.agent.outputs.mcp_policy_error }}
          GH_AW_AGENTIC_ENGINE_TIMEOUT: ${{ needs.agent.outputs.agentic_engine_timeout }}
          GH_AW_MODEL_NOT_SUPPORTED_ERROR: ${{ needs.agent.outputs.model_not_supported_error }}
          GH_AW_MODEL_ENDPOINT_MISMATCH_ERROR: ${{ needs.agent.outputs.model_endpoint_mismatch_error }}
          GH_AW_HTTP_400_RESPONSE_ERROR: ${{ needs.agent.outputs.http_400_response_error }}
          GH_AW_MAX_CACHE_MISSES_EXCEEDED: ${{ needs.agent.outputs.max_cache_misses_exceeded }}
          GH_AW_MISSING_MODEL_PRICING_ERROR: ${{ needs.agent.outputs.missing_model_pricing_error }}
          GH_AW_MISSING_MODEL_PRICING_MODEL_NAME: ${{ needs.agent.outputs.missing_model_pricing_model_name }}
          GH_AW_SHELL_EXPANSION_GUARD_REJECTED: ${{ needs.agent.outputs.shell_expansion_guard_rejected }}
          GH_AW_ENGINE_API_HOSTS: "api.anthropic.com"
          GH_AW_CODE_PUSH_FAILURE_ERRORS: ${{ needs.safe_outputs.outputs.code_push_failure_errors }}
          GH_AW_CODE_PUSH_FAILURE_COUNT: ${{ needs.safe_outputs.outputs.code_push_failure_count }}
          GH_AW_LOCKDOWN_CHECK_FAILED: ${{ needs.activation.outputs.lockdown_check_failed }}
          GH_AW_OAUTH_TOKEN_CHECK_FAILED: ${{ needs.activation.outputs.oauth_token_check_failed }}
          GH_AW_STALE_LOCK_FILE_FAILED: ${{ needs.activation.outputs.stale_lock_file_failed }}
          GH_AW_DAILY_AI_CREDITS_EXCEEDED: ${{ needs.activation.outputs.daily_ai_credits_exceeded }}
          GH_AW_DAILY_AI_CREDITS_GUARDRAIL_STATUS: ${{ needs.activation.outputs.daily_ai_credits_guardrail_status }}
          GH_AW_DAILY_AI_CREDITS_GUARDRAIL_ERROR: ${{ needs.activation.outputs.daily_ai_credits_guardrail_error }}
          GH_AW_DAILY_AI_CREDITS_TOTAL: ${{ needs.activation.outputs.daily_ai_credits_total }}
          GH_AW_DAILY_AI_CREDITS_ESTIMATED: ${{ needs.activation.outputs.daily_ai_credits_estimated }}
          GH_AW_DAILY_AI_CREDITS_THRESHOLD: ${{ needs.activation.outputs.daily_ai_credits_threshold }}
          GH_AW_DAILY_AI_CREDITS_CONTINUE_ON_ERROR: "false"
          GH_AW_GROUP_REPORTS: "false"
          GH_AW_FAILURE_REPORT_AS_ISSUE: "false"
          GH_AW_MISSING_TOOL_REPORT_AS_FAILURE: "true"
          GH_AW_MISSING_DATA_REPORT_AS_FAILURE: "true"
          GH_AW_TIMEOUT_MINUTES: "90"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'handle_agent_failure.cjs'));
            await main();
      - name: Report failed jobs
        id: report_failed_jobs
        if: false # never: failures surface in the run and the retry belt
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_WORKFLOW_NAME: "Agent: Implement Issue"
          GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/agent-implement.md"
          GH_AW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_AW_REPORT_FAILED_JOBS: "false"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'report_failed_jobs.cjs'));
            await main();
      - name: Collect usage artifact files
        if: always()
        continue-on-error: true
        run: bash "${RUNNER_TEMP}/gh-aw/actions/collect_usage_artifact_files.sh"
      - name: Generate usage activity summary and unified session
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_GRADER_MANIFEST_0: '{"version":2,"graders":[]}'
          GH_AW_GRADER_MANIFEST_CHUNKS: '1'
          GH_AW_JOB_DURATIONS: ${{ steps.report_failed_jobs.outputs.job_durations }}
          GH_AW_DAILY_AI_CREDITS_GUARDRAIL_STATUS: ${{ needs.activation.outputs.daily_ai_credits_guardrail_status }}
          GH_AW_DAILY_AI_CREDITS_EXCEEDED: ${{ needs.activation.outputs.daily_ai_credits_exceeded }}
          GH_AW_DAILY_AI_CREDITS_TOTAL: ${{ needs.activation.outputs.daily_ai_credits_total }}
          GH_AW_DAILY_AI_CREDITS_ESTIMATED: ${{ needs.activation.outputs.daily_ai_credits_estimated }}
          GH_AW_DAILY_AI_CREDITS_THRESHOLD: ${{ needs.activation.outputs.daily_ai_credits_threshold }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'generate_usage_artifacts.cjs'));
            await main();
      - name: Upload usage artifact
        id: upload-usage-artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.activation.outputs.artifact_prefix }}usage
          path: |
            /tmp/gh-aw/usage/aw_session.jsonl
            /tmp/gh-aw/usage/aw_info.json
            /tmp/gh-aw/usage/aw-info.jsonl
            /tmp/gh-aw/usage/agent_usage.json
            /tmp/gh-aw/usage/agent_usage.jsonl
            /tmp/gh-aw/usage/detection_usage.jsonl
            /tmp/gh-aw/usage/evals.jsonl
            /tmp/gh-aw/usage/graders/grader_manifest.json
            /tmp/gh-aw/usage/graders/grader_results.json
            /tmp/gh-aw/usage/github_rate_limits.jsonl
            /tmp/gh-aw/usage/agent/token_usage.jsonl
            /tmp/gh-aw/usage/agent/model-routing.jsonl
            /tmp/gh-aw/usage/agent/execution.json
            /tmp/gh-aw/usage/agent/harness_retry.json
            /tmp/gh-aw/usage/agent/durable-session.jsonl
            /tmp/gh-aw/usage/detection/token_usage.jsonl
            /tmp/gh-aw/usage/detection/execution.json
            /tmp/gh-aw/usage/detection/harness_retry.json
            /tmp/gh-aw/usage/detection/detection_result.json
            /tmp/gh-aw/usage/evals/token_usage.jsonl
            /tmp/gh-aw/usage/evals/execution.json
            /tmp/gh-aw/usage/evals/evals_status.json
            /tmp/gh-aw/usage/experiment/state.jsonl
            /tmp/gh-aw/usage/experiment/state.json
            /tmp/gh-aw/usage/experiment/assignments.json
            /tmp/gh-aw/usage/activity/summary.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}
      - name: Wait before retrying usage artifact upload
        if: always() && steps.upload-usage-artifact.outcome == 'failure'
        run: sleep 10
      - name: Retry upload usage artifact
        id: upload-usage-artifact-retry
        if: always() && steps.upload-usage-artifact.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.activation.outputs.artifact_prefix }}usage
          path: |
            /tmp/gh-aw/usage/aw_session.jsonl
            /tmp/gh-aw/usage/aw_info.json
            /tmp/gh-aw/usage/aw-info.jsonl
            /tmp/gh-aw/usage/agent_usage.json
            /tmp/gh-aw/usage/agent_usage.jsonl
            /tmp/gh-aw/usage/detection_usage.jsonl
            /tmp/gh-aw/usage/evals.jsonl
            /tmp/gh-aw/usage/graders/grader_manifest.json
            /tmp/gh-aw/usage/graders/grader_results.json
            /tmp/gh-aw/usage/github_rate_limits.jsonl
            /tmp/gh-aw/usage/agent/token_usage.jsonl
            /tmp/gh-aw/usage/agent/model-routing.jsonl
            /tmp/gh-aw/usage/agent/execution.json
            /tmp/gh-aw/usage/agent/harness_retry.json
            /tmp/gh-aw/usage/agent/durable-session.jsonl
            /tmp/gh-aw/usage/detection/token_usage.jsonl
            /tmp/gh-aw/usage/detection/execution.json
            /tmp/gh-aw/usage/detection/harness_retry.json
            /tmp/gh-aw/usage/detection/detection_result.json
            /tmp/gh-aw/usage/evals/token_usage.jsonl
            /tmp/gh-aw/usage/evals/execution.json
            /tmp/gh-aw/usage/evals/evals_status.json
            /tmp/gh-aw/usage/experiment/state.jsonl
            /tmp/gh-aw/usage/experiment/state.json
            /tmp/gh-aw/usage/experiment/assignments.json
            /tmp/gh-aw/usage/activity/summary.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}

  eligibility:
    name: eligibility
    needs: activation
    runs-on: ubuntu-24.04
    # Permissions for the eligibility job (workflow permissions default to none).
    permissions:
      # The checkout below needs it: an exhaustive permissions map leaves contents at none,
      # which a public repository forgives and a private one answers with "Repository not
      # found" (release canary, 21/11/2026: five implement attempts read as an outage).
      contents: read
      issues: read # Read issues and comments for workflow context.
      pull-requests: read # Read pull requests and review comments for workflow context.
    outputs:
      blocked_by: "${{ steps.check.outputs.blocked_by }}"
      duplicate: "${{ steps.duplicate.outputs.open }}"
      eligible: "${{ steps.check.outputs.eligible }}"
    steps:
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip issues planned for the future
        id: check
        run: bash ./.github/actions/check-implement-eligibility/check-eligibility.sh
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
      - name: Read the linkage the App recorded
        id: linkage
        if: steps.check.outputs.eligible == 'true'
        uses: ./.github/actions/resolve-change-linkage
        with:
          bot-login: personalcorpacc-agentic-loop[bot]
          issue-number: ${{ inputs.issue-number }}
          token: ${{ github.token }}
      - name: Stop if this issue already has an open pull request
        id: duplicate
        if: steps.check.outputs.eligible == 'true'
        run: bash ./.github/actions/check-implement-eligibility/find-existing-change.sh
        env:
          GH_TOKEN: ${{ github.token }}
          HOLD_LABEL: ${{ env.HOLD_LABEL }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          LINKED_PR: ${{ steps.linkage.outputs.pr }}
          REPO: ${{ github.repository }}
          ROLLBACK_LABEL: ${{ env.ROLLBACK_LABEL }}

  hold:
    name: hold
    needs:
      - agent
      - eligibility
    if: always() && needs.eligibility.outputs.eligible == 'false' && needs.eligibility.outputs.blocked_by != ''
    runs-on: ubuntu-24.04
    # Permissions for the hold job (workflow permissions default to none).
    permissions:
      contents: read
      issues: write # Create or update issues and comments.
    steps:
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release the issue and say what it waits for
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$GH_AW_ENV_WORKING_LABEL" || true
          marker="<!-- implement-held-for-blockers -->"
          already=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | grep -c . || true)
          if [ "${already:-0}" -eq 0 ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "${marker}
          Held: this issue is blocked by ${BLOCKED_BY}, which must land first. It keeps \`$GH_AW_ENV_IMPLEMENT_LABEL\` and starts on its own once every blocker is closed."
          fi
        env:
          GH_AW_ENV_IMPLEMENT_LABEL: ${{ env.IMPLEMENT_LABEL }}
          GH_AW_ENV_WORKING_LABEL: ${{ env.WORKING_LABEL }}
      - name: Record the outcome
        if: always()
        uses: ./.github/actions/record-outcome
        with:
          detail: ${{ format('Blocked by {0}; it starts when they close.', needs.eligibility.outputs.blocked_by) }}
          outcome: no-action
          reason: blocked
          route: implement
          subject: "${{ format('#{0}', inputs.issue-number) }}"

  incomplete:
    name: incomplete
    needs:
      - activation
      - agent
      - eligibility
      - safe_outputs
    if: >
      always() && needs.eligibility.outputs.eligible == 'true' && (
      needs.agent.result != 'success' ||
      needs.safe_outputs.result != 'success'
      )
    runs-on: ubuntu-24.04
    # Permissions for the incomplete job (workflow permissions default to none).
    permissions:
      # the retry re-enters through the router, which is a workflow_dispatch
      actions: write
      contents: read
      issues: write # Create or update issues and comments.
    steps:
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          owner: ${{ github.repository_owner }}
          permission-actions: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Classify the failure
        id: classify
        run: bash ./.github/actions/retry-pending/classify-incomplete.sh
        env:
          CREDITS_EXCEEDED: ${{ needs.activation.outputs.daily_ai_credits_exceeded || 'false' }}
          GH_TOKEN: ${{ github.token }}
          REFUSAL_SIGNATURE: ${{ env.REFUSAL_SIGNATURE }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          UNDER_MINUTES: ${{ env.RETRY_UNDER_MINUTES }}
      - name: Decide whether this failure is worth repeating
        id: decide
        run: |
          set -euo pipefail
          retry=false
          deferred=false
          if [ "$KIND" = outage ] && [ "$ATTEMPTS" -lt "$PARK_AT" ]; then retry=true; fi
          if [ "$KIND" = credits ]; then deferred=true; fi
          {
            echo "retry=$retry"
            echo "deferred=$deferred"
            echo "billing=$BILLING"
            echo "next=$((ATTEMPTS + 1))"
            echo "minutes=$MINUTES"
          } >> "$GITHUB_OUTPUT"
          echo "kind=${KIND}; attempts so far ${ATTEMPTS}; retry=${retry}; deferred=${deferred}"
        env:
          ATTEMPTS: ${{ inputs.attempts_so_far || '0' }}
          BILLING: ${{ steps.classify.outputs.billing }}
          KIND: ${{ steps.classify.outputs.kind }}
          MINUTES: ${{ steps.classify.outputs.minutes }}
          PARK_AT: ${{ env.PARK_AT_ATTEMPT }}
      - name: Report the failed attempt
        if: steps.decide.outputs.retry == 'true'
        uses: ./.github/actions/create-issue-comment
        with:
          body: |
            ${{ env.ATTEMPT_MARKER }}
            Attempt ${{ steps.decide.outputs.next }} of ${{ env.MAX_ATTEMPTS }} ended after ${{ steps.decide.outputs.minutes }} minutes, before the run could produce an answer. ${{ steps.classify.outputs.transient == 'true' && 'Its last answer from the model provider was a temporary one (a challenge page or a server error), not a refusal' || 'That is what a provider outage looks like' }}, so this is being retried.
            The issue keeps `implement`.
            [View this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          issue-number: ${{ inputs.issue-number }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Say that the model credential has no credit
        if: steps.decide.outputs.billing == 'true'
        uses: ./.github/actions/create-issue-comment
        with:
          body: |
            ${{ env.ATTEMPT_MARKER }}
            The model provider refused this run: the account behind this repository's model credential has no credit, or the credential itself was refused. Nothing is wrong with the issue or the branch, and retrying will not help until somebody fixes the account.
            The issue is handed to a person: once the account works, remove `${{ env.REVIEW_LABEL }}` and add `implement` again.
            [View this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          issue-number: ${{ inputs.issue-number }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Release the reservation after a billing failure
        if: steps.decide.outputs.billing == 'true'
        uses: ./.github/actions/remove-issue-labels
        with:
          issue-number: ${{ inputs.issue-number }}
          labels: ${{ env.WORKING_LABEL }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Release the reservation for the retry
        if: steps.decide.outputs.retry == 'true'
        uses: ./.github/actions/remove-issue-labels
        with:
          issue-number: ${{ inputs.issue-number }}
          labels: ${{ env.WORKING_LABEL }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Send the issue back through the router
        if: steps.decide.outputs.retry == 'true'
        run: |
          set -euo pipefail
          # The provider recovers in seconds, so pause before re-entering rather than dispatching
          # back into the same outage. The router's own classify and authorize jobs add more.
          sleep 30
          # `retry-of` names this run, which is still in progress while it dispatches: without
          # it the router's in-flight check saw this run as an implement already running for
          # the issue and dropped every retry as a duplicate (loopscope #164, 21/11/2026).
          gh workflow run work-router.yml --repo "$REPO" --ref "$REF" \
            -f operation=implement -f issue-number="$ISSUE_NUMBER" -f attempts_so_far="$NEXT" \
            -f retry-of="$RUN_ID"
          echo "Re-dispatched implement for #$ISSUE_NUMBER as attempt $NEXT."
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          NEXT: ${{ steps.decide.outputs.next }}
          REF: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
      - name: Release the reservation until the allowance resets
        if: steps.decide.outputs.deferred == 'true'
        uses: ./.github/actions/remove-issue-labels
        with:
          issue-number: ${{ inputs.issue-number }}
          labels: ${{ env.WORKING_LABEL }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Say the run will be retried
        if: steps.decide.outputs.deferred == 'true'
        uses: ./.github/actions/create-issue-comment
        with:
          body: |
            <!-- agent-retry-pending: implement credits -->
            The agent did not start: this repository has used its daily AI-credit allowance (${{ needs.activation.outputs.daily_ai_credits_total }} of ${{ needs.activation.outputs.daily_ai_credits_threshold }}; the `GH_AW_DEFAULT_MAX_DAILY_AI_CREDITS` repository variable sets it). Nothing is wrong with the issue. It keeps `implement`, and the hourly sweep starts it again; raise the variable to allow more today.
            [View this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          issue-number: ${{ inputs.issue-number }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Release the selected issue
        if: steps.decide.outputs.retry != 'true' && steps.decide.outputs.deferred != 'true'
        uses: ./.github/actions/remove-issue-labels
        with:
          issue-number: ${{ inputs.issue-number }}
          labels: |
            ${{ env.WORKING_LABEL }}
            implement
          token: ${{ steps.app-token.outputs.token }}
      - name: Flag for human review
        if: steps.decide.outputs.retry != 'true' && steps.decide.outputs.deferred != 'true'
        uses: ./.github/actions/add-issue-labels
        with:
          issue-number: ${{ inputs.issue-number }}
          labels: ${{ env.REVIEW_LABEL }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Report missing implementation outcome
        if: steps.decide.outputs.retry != 'true' && steps.decide.outputs.deferred != 'true'
        uses: ./.github/actions/create-issue-comment
        with:
          body: |
            ${{ env.IMPLEMENT_MARKER }}
            ${{ env.INCOMPLETE_COMMENT }}
            ${{ needs.activation.outputs.daily_ai_credits_exceeded == 'true' && format('The agent did not start: this repository has used its daily AI-credit allowance ({0} of {1}; the `GH_AW_DEFAULT_MAX_DAILY_AI_CREDITS` repository variable sets it). Work resumes once the day''s usage is back under it; raise the variable to allow more.', needs.activation.outputs.daily_ai_credits_total, needs.activation.outputs.daily_ai_credits_threshold) || '' }}
            [View this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          issue-number: ${{ inputs.issue-number }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Pick up queued work
        if: always()
        uses: ./.github/actions/pick-up-queued-work
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

  pre_activation:
    name: pre_activation
    if: inputs.issue-number != ''
    runs-on: ubuntu-24.04
    env:
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      activated: ${{ steps.check_membership.outputs.is_team_member == 'true' }}
      matched_command: ''
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@dfe97a19c8249d41e2adfc95f92db2b8facea58f # v1.3.1
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Agent: Implement Issue"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/agent-implement.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "2.1.325"
          GH_AW_INFO_AWF_VERSION: "v0.29.14"
          GH_AW_INFO_ENGINE_ID: "claude"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Check team membership for workflow
        id: check_membership
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_REQUIRED_ROLES: "admin,maintainer,write"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'check_membership.cjs'));
            await main();

  reserve:
    name: reserve
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true' && needs.eligibility.outputs.duplicate != 'true'
    runs-on: ubuntu-24.04
    # Permissions for the reserve job (workflow permissions default to none).
    permissions:
      contents: read
      issues: write # Create or update issues and comments.
    outputs:
      base_tip: "${{ steps.base_tip.outputs.sha }}"
      branch_point_tip: "${{ steps.branch_point_tip.outputs.sha }}"
    steps:
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Checkout workflow actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          owner: ${{ github.repository_owner }}
          permission-actions: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Record the base branch's tip
        id: base_tip
        if: env.BASE_BRANCH != env.BRANCH_POINT
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${REPO}/commits/${BASE_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Base branch ${BASE_BRANCH} is at ${sha:-<unknown>} before this run's agent starts."
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - name: Record the branch point's tip
        id: branch_point_tip
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${REPO}/commits/${BRANCH_POINT}" --jq '.sha' 2>/dev/null || true)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Branch point ${BRANCH_POINT} is at ${sha:-<unknown>} before this run's agent starts."
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - name: Mark the selected issue as in progress
        uses: ./.github/actions/add-issue-labels
        with:
          issue-number: ${{ inputs.issue-number }}
          labels: ${{ env.WORKING_LABEL }}
          token: ${{ github.token }}
      - name: Clear the human-needed flag
        uses: ./.github/actions/remove-issue-labels
        with:
          issue-number: ${{ inputs.issue-number }}
          labels: ${{ env.REVIEW_LABEL }}
          token: ${{ steps.app-token.outputs.token }}

  safe_outputs:
    name: safe_outputs
    needs:
      - activation
      - agent
    if: (!cancelled()) && needs.agent.result != 'skipped'
    runs-on: ubuntu-24.04
    # Permissions for the safe_outputs job (workflow permissions default to none).
    permissions:
      contents: write # Create or update repository contents.
      issues: write # Create or update issues and comments.
      pull-requests: write # Create or update pull requests and review comments.
    timeout-minutes: 45
    env:
      GH_AW_AGENT_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AMBIENT_CONTEXT: ${{ needs.agent.outputs.ambient_context }}
      GH_AW_CALLER_WORKFLOW_ID: "${{ github.repository }}/agent-implement"
      GH_AW_ENGINE_ID: "claude"
      GH_AW_ENGINE_MODEL: "claude-sonnet-5"
      GH_AW_OBJECT_PACK_FETCH_DEPTHS: ${{ vars.GH_AW_OBJECT_PACK_FETCH_DEPTHS }}
      GH_AW_OBJECT_PACK_MAX_BYTES: ${{ vars.GH_AW_OBJECT_PACK_MAX_BYTES }}
      GH_AW_OBJECT_PACK_MAX_OBJECTS: ${{ vars.GH_AW_OBJECT_PACK_MAX_OBJECTS }}
      GH_AW_OBJECT_PACK_TIMEOUT_MS: ${{ vars.GH_AW_OBJECT_PACK_TIMEOUT_MS }}
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_WORKFLOW_ID: "agent-implement"
      GH_AW_WORKFLOW_NAME: "Agent: Implement Issue"
      GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/agent-implement.md"
    outputs:
      activation_comment_links: ${{ steps.process_safe_outputs.outputs.activation_comment_links }}
      code_push_failure_count: ${{ steps.process_safe_outputs.outputs.code_push_failure_count }}
      code_push_failure_errors: ${{ steps.process_safe_outputs.outputs.code_push_failure_errors }}
      create_discussion_error_count: ${{ steps.process_safe_outputs.outputs.create_discussion_error_count }}
      create_discussion_errors: ${{ steps.process_safe_outputs.outputs.create_discussion_errors }}
      created_pr_number: ${{ steps.process_safe_outputs.outputs.created_pr_number }}
      created_pr_url: ${{ steps.process_safe_outputs.outputs.created_pr_url }}
      process_safe_outputs_items_applied: ${{ steps.process_safe_outputs.outputs.items_applied }}
      process_safe_outputs_items_cancelled: ${{ steps.process_safe_outputs.outputs.items_cancelled }}
      process_safe_outputs_items_deferred: ${{ steps.process_safe_outputs.outputs.items_deferred }}
      process_safe_outputs_items_failed: ${{ steps.process_safe_outputs.outputs.items_failed }}
      process_safe_outputs_items_skipped: ${{ steps.process_safe_outputs.outputs.items_skipped }}
      process_safe_outputs_items_succeeded: ${{ steps.process_safe_outputs.outputs.items_succeeded }}
      process_safe_outputs_items_warnings: ${{ steps.process_safe_outputs.outputs.items_warnings }}
      process_safe_outputs_processed_count: ${{ steps.process_safe_outputs.outputs.processed_count }}
      process_safe_outputs_status: ${{ steps.process_safe_outputs.outputs.status }}
      push_commit_sha: ${{ steps.process_safe_outputs.outputs.push_commit_sha }}
      push_commit_url: ${{ steps.process_safe_outputs.outputs.push_commit_url }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@dfe97a19c8249d41e2adfc95f92db2b8facea58f # v1.3.1
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Agent: Implement Issue"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/agent-implement.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "2.1.325"
          GH_AW_INFO_AWF_VERSION: "v0.29.14"
          GH_AW_INFO_ENGINE_ID: "claude"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{${{ needs.activation.outputs.artifact_prefix }}agent,${{ needs.activation.outputs.artifact_prefix }}agent-output-fallback}"
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          if [ -f "/tmp/gh-aw/agent_output.json" ]; then
            echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Download patch artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.activation.outputs.artifact_prefix }}agent
          path: /tmp/gh-aw/
      - name: Checkout repository (gh-aw default)
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request') || (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'push_to_pull_request_branch')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Fetch additional refs
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request') || (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'push_to_pull_request_branch')
        env:
          GH_AW_FETCH_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          header=$(printf "x-access-token:%s" "${GH_AW_FETCH_TOKEN}" | base64 -w 0)
          refspecs=('+refs/heads/*:refs/remotes/origin/*')
          for refspec in "${refspecs[@]}"; do
            source_ref=${refspec%%:*}
            source_ref=${source_ref#+}
            if matched=$(git -c "http.extraheader=Authorization: Basic ${header}" ls-remote --exit-code origin "$source_ref" | {
              found=0
              while read -r _ remote_ref; do
                # Match the configured ref glob, not a literal string.
                # shellcheck disable=SC2254
                case "$remote_ref" in ($source_ref) found=1 ;; esac
              done
              printf '%s' "$found"
            }); then
              if [ "$matched" -eq 0 ]; then continue; fi
              git -c "http.extraheader=Authorization: Basic ${header}" fetch origin "$refspec"
            else
              status=$?
              if [ "$status" -ne 2 ]; then exit "$status"; fi
            fi
          done
      - name: Configure Git credentials
        if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'create_pull_request') || (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'push_to_pull_request_branch')
        env:
          GH_AW_GIT_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GIT_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Process Safe Outputs
        id: process_safe_outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_COMMENT_ID: ${{ needs.activation.outputs.comment_id }}
          GH_AW_MENTIONS_GITHUB_TOKEN: ${{ github.token }}
          GH_AW_ALLOWED_DOMAINS: "*.githubusercontent.com,*.vsblob.vsassets.io,api.anthropic.com,api.npms.io,api.nuget.org,archive.ubuntu.com,azure.archive.ubuntu.com,azuresearch-usnc.nuget.org,azuresearch-ussc.nuget.org,builds.dotnet.microsoft.com,bun.sh,cdn.jsdelivr.net,ci.dot.net,codeload.github.com,crl.geotrust.com,crl.globalsign.com,crl.identrust.com,crl.sectigo.com,crl.thawte.com,crl.usertrust.com,crl.verisign.com,crl3.digicert.com,crl4.digicert.com,crls.ssl.com,deb.nodesource.com,deno.land,dist.nuget.org,docs.github.com,dot.net,dotnet.microsoft.com,dotnetcli.blob.core.windows.net,esm.sh,fonts.googleapis.com,fonts.gstatic.com,get.pnpm.io,github-cloud.githubusercontent.com,github-cloud.s3.amazonaws.com,github.blog,github.com,github.githubassets.com,googleapis.deno.dev,googlechromelabs.github.io,json-schema.org,json.schemastore.org,jsr.io,keyserver.ubuntu.com,lfs.github.com,login.microsoftonline.com,nodejs.org,npm.pkg.github.com,npmjs.com,npmjs.org,nuget.org,nuget.pkg.github.com,nugetregistryv2prod.blob.core.windows.net,objects.githubusercontent.com,ocsp.digicert.com,ocsp.geotrust.com,ocsp.globalsign.com,ocsp.identrust.com,ocsp.sectigo.com,ocsp.ssl.com,ocsp.thawte.com,ocsp.usertrust.com,ocsp.verisign.com,oneocsp.microsoft.com,packagefeedproxy.microsoft.io,patch-diff.githubusercontent.com,patchdiff.githubusercontent.com,pkgs.dev.azure.com,raw.githubusercontent.com,registry.bower.io,registry.npmjs.com,registry.npmjs.org,registry.yarnpkg.com,repo.yarnpkg.com,s.symcb.com,s.symcd.com,security.ubuntu.com,skimdb.npmjs.com,storage.googleapis.com,ts-crl.ws.symantec.com,ts-ocsp.ws.symantec.com,www.microsoft.com,www.npmjs.com,www.npmjs.org,yarnpkg.com"
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}
          GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG: "{\"create_pull_request\":{\"allowed_files\":[\"**\"],\"auto_close_issue\":false,\"base_branch\":\"dev\",\"branch_prefix\":\"agent/${{ inputs.issue-number }}-${{ github.run_id }}/\",\"draft\":false,\"fallback_as_issue\":false,\"if_no_changes\":\"error\",\"max\":1,\"max_patch_files\":1000,\"max_patch_size\":4096,\"preserve_branch_name\":true,\"protect_top_level_dot_folders\":true,\"protected_files\":[\"package.json\",\"bun.lockb\",\"bunfig.toml\",\"deno.json\",\"deno.jsonc\",\"deno.lock\",\"global.json\",\"NuGet.Config\",\"Directory.Packages.props\",\"mix.exs\",\"mix.lock\",\"go.mod\",\"go.sum\",\"stack.yaml\",\"stack.yaml.lock\",\"pom.xml\",\"build.gradle\",\"build.gradle.kts\",\"settings.gradle\",\"settings.gradle.kts\",\"gradle.properties\",\"package-lock.json\",\"yarn.lock\",\"pnpm-lock.yaml\",\"npm-shrinkwrap.json\",\"requirements.txt\",\"Pipfile\",\"Pipfile.lock\",\"pyproject.toml\",\"setup.py\",\"setup.cfg\",\"Gemfile\",\"Gemfile.lock\",\"uv.lock\",\"CODEOWNERS\",\"DESIGN.md\",\"README.md\",\"CONTRIBUTING.md\",\"SECURITY.md\",\"CODE_OF_CONDUCT.md\",\"CLAUDE.md\",\"AGENTS.md\"],\"protected_files_policy\":\"allowed\",\"signed_commits\":false,\"title_prefix\":\"[bot] \"},\"create_report_incomplete_issue\":{},\"noop\":{\"max\":2,\"report-as-issue\":\"false\"},\"push_to_pull_request_branch\":{\"check_branch_protection\":false,\"fallback_as_pull_request\":false,\"if_no_changes\":\"warn\",\"max_patch_size\":4096,\"protect_top_level_dot_folders\":true,\"protected_files\":[\"package.json\",\"bun.lockb\",\"bunfig.toml\",\"deno.json\",\"deno.jsonc\",\"deno.lock\",\"global.json\",\"NuGet.Config\",\"Directory.Packages.props\",\"mix.exs\",\"mix.lock\",\"go.mod\",\"go.sum\",\"stack.yaml\",\"stack.yaml.lock\",\"pom.xml\",\"build.gradle\",\"build.gradle.kts\",\"settings.gradle\",\"settings.gradle.kts\",\"gradle.properties\",\"package-lock.json\",\"yarn.lock\",\"pnpm-lock.yaml\",\"npm-shrinkwrap.json\",\"requirements.txt\",\"Pipfile\",\"Pipfile.lock\",\"pyproject.toml\",\"setup.py\",\"setup.cfg\",\"Gemfile\",\"Gemfile.lock\",\"uv.lock\",\"CODEOWNERS\",\"DESIGN.md\",\"README.md\",\"CONTRIBUTING.md\",\"SECURITY.md\",\"CODE_OF_CONDUCT.md\",\"CLAUDE.md\",\"AGENTS.md\"],\"protected_files_policy\":\"request-review\",\"signed_commits\":false,\"target\":\"*\",\"title_prefix\":\"[bot] \"},\"report_incomplete\":{},\"report_missing_data\":{},\"report_missing_tool\":{}}"
          GH_AW_CI_TRIGGER_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN }}
          GH_AW_GITHUB_TOKEN_SOURCE: ${{ secrets.GH_AW_GITHUB_TOKEN != '' && 'pat' || 'github_actions' }}
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit, process.env.GH_AW_GITHUB_TOKEN_SOURCE);
            const { main } = require(path.join(actionsDir, 'process_safe_outputs.cjs'));
            await main();
      - name: Upload Safe Outputs Items
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.activation.outputs.artifact_prefix }}safe-outputs-items
          path: |
            /tmp/gh-aw/safe-output-items.jsonl
            /tmp/gh-aw/safe-output-executions.jsonl
            /tmp/gh-aw/temporary-id-map.json
            /tmp/gh-aw/safe-output-errors.json
          if-no-files-found: ignore
          retention-days: ${{ vars.GH_AW_DEFAULT_ARTIFACT_RETENTION_DAYS || '0' }}
