name: Apply agent comments
description: Post every add_comment item from agent_output.json.
inputs:
  output-file:
    description: Path to agent_output.json.
    required: true
  token:
    description: GitHub token with issues:write and pull-requests:write.
    required: true
  target:
    description: >
      When set, every comment is posted here whatever item_number the agent gave it. For a
      worker whose comment has exactly one right place, so a misaddressed one still lands.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Post comments
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        AGENT_OUTPUT_LIB: ${{ github.action_path }}/../agent-output.cjs
        OUTPUT_FILE: ${{ inputs.output-file }}
        COMMENT_TARGET: ${{ inputs.target }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { readAgentItems } = require(process.env.AGENT_OUTPUT_LIB);
          const items = readAgentItems(process.env.OUTPUT_FILE, 'add_comment');

          let posted = 0;

          const target = process.env.COMMENT_TARGET;
          for (const item of items) {
            if (target) {
              if (String(item.item_number ?? '') !== target) {
                core.notice(`add_comment addressed to #${item.item_number ?? '(none)'} is posted on #${target}, where this worker's comment belongs.`);
              }
              item.item_number = target;
            }
            if (!item.item_number) {
              core.warning(`add_comment item has no item_number, skipping: ${JSON.stringify(item)}`);
              continue;
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(item.item_number),
              body: item.body,
            });

            posted += 1;
          }

          core.info(`Posted ${posted} comment(s).`);
