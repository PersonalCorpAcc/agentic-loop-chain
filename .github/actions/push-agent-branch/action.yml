# Managed by @plainconceptsplatform/workflows@0.5.1. Source: loops/actions/push-agent-branch/action.yml. Profile digest: 08448fbaf1f8. Update with workflows update --force; consumer edits may be overwritten.
name: Push agent branch
description: Read push_to_pull_request_branch from agent_output.json and fast-forward from its git bundle.
inputs:
  output-file:
    description: Path to agent_output.json.
    required: true
  bundle-file:
    description: Path to the git bundle from the agent artifact.
    required: false
    default: ''
  pr-number:
    description: >-
      The pull request being pushed to. The branch is resolved from this through the forge,
      never from the agent's output, which is what makes the target a fact rather than a
      claim (FR-063).
    required: true
  token:
    description: GitHub token with contents:write.
    required: true
runs:
  using: composite
  steps:
    - name: Resolve the pull request's own branch
      id: request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        BUNDLE_FILE: ${{ inputs.bundle-file }}
        PR_NUMBER: ${{ inputs.pr-number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        [ -f "$OUTPUT_FILE" ] || exit 0

        ITEM=$(jq -c '.items[] | select(.type == "push_to_pull_request_branch")' "$OUTPUT_FILE")
        [ -n "$ITEM" ] || exit 0

        case "$PR_NUMBER" in
          '' | *[!0-9]*)
            echo "::error::push-agent-branch was called without a pull request number, so there is nothing to resolve the target branch from."
            exit 1
            ;;
        esac

        # The forge is the authority on where this pull request's head is. The agent's item
        # is a claim about it, and the two are compared rather than one of them trusted: a
        # run that proposes a push to somebody else's branch stops here.
        pr="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state,author,headRefName,headRepositoryOwner,headRepository)"
        state="$(jq -r '.state' <<<"$pr")"
        [ "$state" = "OPEN" ] || { echo "::error::PR #${PR_NUMBER} is ${state}; a closed pull request's branch is not pushed to."; exit 1; }

        # GitHub's own bot flag: App login formats differ between APIs.
        [ "$(jq -r '.author.is_bot' <<<"$pr")" = "true" ] ||
          { echo "::error::PR #${PR_NUMBER} was opened by $(jq -r '.author.login' <<<"$pr"), a human. This action pushes only to the loop's own pull requests."; exit 1; }

        head_repo="$(jq -r '(.headRepositoryOwner.login // "") + "/" + (.headRepository.name // "")' <<<"$pr")"
        [ "$head_repo" = "$REPO" ] ||
          { echo "::error::PR #${PR_NUMBER} has its head in ${head_repo}, not ${REPO}. A fork's branch is not this repository's to write."; exit 1; }

        resolved="$(jq -r '.headRefName' <<<"$pr")"
        claimed="$(jq -r '.branch // ""' <<<"$ITEM")"
        if [ -n "$claimed" ] && [ "$claimed" != "$resolved" ]; then
          echo "::error::The agent asked to push to '${claimed}', but PR #${PR_NUMBER}'s head is '${resolved}'. Refusing rather than writing the branch it named."
          exit 1
        fi

        echo "branch=$resolved" >> "$GITHUB_OUTPUT"
    - name: Apply bundle to pull request branch
      if: steps.request.outputs.branch != '' && inputs.bundle-file != ''
      uses: ./.github/actions/apply-agent-bundle
      with:
        bundle-file: ${{ inputs.bundle-file }}
        target-branch: ${{ steps.request.outputs.branch }}
        token: ${{ inputs.token }}
