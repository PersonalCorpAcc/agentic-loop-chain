# Managed by @plainconceptsplatform/workflows@0.5.1. Source: loops/actions/merge-agent-pr/action.yml. Profile digest: 08448fbaf1f8. Update with workflows update --force; consumer edits may be overwritten.
name: Merge agent pull request
description: Read merge_pull_request from agent_output.json and merge the PR via gh, once the forge says it will take it.
inputs:
  output-file:
    description: Path to agent_output.json.
    required: true
  token:
    description: GitHub token with pull-requests:write and contents:write.
    required: true
  repo:
    description: Target repository in owner/name format.
    required: false
    default: ${{ github.repository }}
  merge-method:
    description: How the forge merges a pull request, from the profile.
    required: false
    default: 'rebase'
outputs:
  outcome:
    description: merged, armed when a rule is holding it and auto-merge now owns the merge, review when the forge will not take it, or none when the agent asked for no merge.
    value: ${{ steps.merge.outputs.outcome || steps.subject.outputs.outcome }}
runs:
  using: composite
  steps:
    # The pull request the agent asked to merge, read once. Its number is validated here so
    # that everything after it is working with a number rather than with whatever the agent
    # wrote (FR-063).
    - name: Read the requested merge
      id: subject
      shell: bash
      env:
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        set -euo pipefail
        echo "outcome=none" >> "$GITHUB_OUTPUT"
        [ -f "$OUTPUT_FILE" ] || exit 0

        pr="$(jq -r '[.items[] | select(.type == "merge_pull_request") | (.pr_number // .item_number)] | first // empty' "$OUTPUT_FILE")"
        [ -n "$pr" ] || exit 0
        [[ "$pr" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid pull request number: $pr"; exit 1; }
        echo "pr=$pr" >> "$GITHUB_OUTPUT"
    - name: Check the forge will take the merge
      id: preconditions
      if: steps.subject.outputs.pr != ''
      uses: ./.github/actions/check-merge-preconditions
      with:
        token: ${{ inputs.token }}
        pr-number: ${{ steps.subject.outputs.pr }}
        repo: ${{ inputs.repo }}
        merge-method: ${{ inputs.merge-method }}
    - name: Merge, or say why not
      id: merge
      if: steps.subject.outputs.pr != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        PR_NUM: ${{ steps.subject.outputs.pr }}
        MERGE_METHOD: ${{ inputs.merge-method }}
        MERGEABLE: ${{ steps.preconditions.outputs.mergeable }}
        DEFERRABLE: ${{ steps.preconditions.outputs.deferrable }}
        REFUSAL: ${{ steps.preconditions.outputs.refusal }}
      run: |
        set -euo pipefail

        # A rule is holding it and the rule may still be satisfied, so the pull request is
        # marked ready rather than handed over: the forge merges it when the required review
        # or check arrives (FR-080). Nothing here merges past a rule, with or without a
        # bypass permission.
        if [ "$MERGEABLE" != "true" ] && [ "$DEFERRABLE" = "true" ]; then
          if armed="$(gh pr merge "$PR_NUM" --repo "$REPO" "--${MERGE_METHOD}" --auto 2>&1)"; then
            echo "outcome=armed" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR_NUM" --repo "$REPO" --body "The merge gate marked this pull request ready: ${REFUSAL}"
            echo "PR #${PR_NUM}: auto-merge armed (${MERGE_METHOD})."
            exit 0
          fi
          # Allow auto-merge is off, which is the repository default. Named, because the
          # alternative is a pull request that waits for ever with nothing saying why.
          echo "outcome=review" >> "$GITHUB_OUTPUT"
          gh pr comment "$PR_NUM" --repo "$REPO" --body "The merge gate did not merge this pull request: ${REFUSAL}

          It could not be marked ready either, because **Allow auto-merge** is switched off for this repository. Turn it on in Settings, or merge by hand once the rule is satisfied."
          echo "::warning::PR #${PR_NUM} was not merged and could not be armed. ${armed}"
          exit 0
        fi

        if [ "$MERGEABLE" != "true" ]; then
          # A review, not a red run: the run failing says neither which pull request nor
          # what to do about it, and the comment says both (FR-068).
          echo "outcome=review" >> "$GITHUB_OUTPUT"
          gh pr comment "$PR_NUM" --repo "$REPO" --body "The merge gate did not merge this pull request: ${REFUSAL}"
          echo "::warning::PR #${PR_NUM} was not merged: ${REFUSAL}"
          exit 0
        fi

        head_sha=$(gh pr view "$PR_NUM" --repo "$REPO" --json headRefOid --jq '.headRefOid')
        [[ "$head_sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::Invalid pull request head SHA for #$PR_NUM"; exit 1; }

        gh pr merge "$PR_NUM" --repo "$REPO" "--${MERGE_METHOD}" --match-head-commit "$head_sha"
        echo "outcome=merged" >> "$GITHUB_OUTPUT"
