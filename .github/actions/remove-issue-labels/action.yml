# Managed by @plainconceptsplatform/workflows@0.5.1. Source: loops/actions/remove-issue-labels/action.yml. Profile digest: 08448fbaf1f8. Update with workflows update --force; consumer edits may be overwritten.
name: Remove issue labels
description: Remove one or more labels from an issue or pull request.
inputs:
  token:
    description: GitHub token used by github-script.
    required: true
  issue-number:
    description: >
      Issue or pull request number, or several, one per line or comma separated. A promotion
      under `env-promotion` carries a set of issues rather than one (FR-031, FR-051).
    required: true
  labels:
    description: Labels to remove, one per line. A comma-separated list is accepted as well.
    required: true
runs:
  using: composite
  steps:
    - name: Remove labels
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        LABELS: ${{ inputs.labels }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          // Callers wrote `labels: a,b` while this split on newlines, so one label named "a,b"
          // was removed: a 404, swallowed below, and neither label ever came off.
          const issues = process.env.ISSUE_NUMBER.split(/\r?\n|,/).map((entry) => entry.trim()).filter(Boolean);
          for (const issue of issues) {
            for (const label of process.env.LABELS.split(/\r?\n|,/).map((label) => label.trim()).filter(Boolean)) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: Number(issue),
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
          }
