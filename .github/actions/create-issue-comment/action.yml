# Managed by @plainconceptsplatform/workflows@0.5.1. Source: loops/actions/create-issue-comment/action.yml. Profile digest: 08448fbaf1f8. Update with workflows update --force; consumer edits may be overwritten.
name: Create issue comment
description: Create a comment on an issue or pull request.
inputs:
  token:
    description: GitHub token used by github-script.
    required: true
  issue-number:
    description: >
      Issue or pull request number, or several, one per line or comma separated; each one
      receives the same comment. A promotion under `env-promotion` carries a set of issues
      and the thing that happened to it happened to all of them (FR-031, FR-051).
    required: true
  body:
    description: Complete Markdown comment body.
    required: true
runs:
  using: composite
  steps:
    - name: Create comment
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        BODY: ${{ inputs.body }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const issues = process.env.ISSUE_NUMBER.split(/\r?\n|,/).map((entry) => entry.trim()).filter(Boolean);
          for (const issue of issues) {
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(issue),
              body: process.env.BODY,
            });
          }
