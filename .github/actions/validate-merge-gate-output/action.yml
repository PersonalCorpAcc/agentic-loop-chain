# Managed by @plainconceptsplatform/workflows@0.5.1. Source: loops/actions/validate-merge-gate-output/action.yml. Profile digest: 08448fbaf1f8. Update with workflows update --force; consumer edits may be overwritten.
name: Validate merge-gate output
description: Verify agent_output.json contains a usable merge-gate verdict before any state changes.
inputs:
  output-file:
    description: Path to agent_output.json.
    required: true
  issue-number:
    description: >
      The number the merge-gate comment must target. An issue for an ordinary pull request,
      and the pull request itself for a promotion, which has no single issue its assessment
      could belong to (FR-056). The check is that the agent commented where it was told to;
      which kind of thing that is, is the caller's to know.
    required: true
  ci-conclusion:
    description: CI conclusion supplied to the merge gate.
    required: true
outputs:
  valid:
    description: Whether the output contains a usable merge-gate comment with a verdict.
    value: ${{ steps.validate.outputs.valid }}
  outcome:
    description: "Deterministic outcome: merge, approve, review, remediated, or invalid."
    value: ${{ steps.validate.outputs.outcome }}
runs:
  using: composite
  steps:
    - name: Validate merge-gate outcome
      id: validate
      shell: bash
      env:
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        CI_CONCLUSION: ${{ inputs.ci-conclusion }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        set -euo pipefail

        outcome="$(bash "${{ github.action_path }}/validate-merge-gate-output.sh" "$OUTPUT_FILE" "$ISSUE_NUMBER" "$CI_CONCLUSION")"
        echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
        echo "valid=$([ "$outcome" != 'invalid' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

        if [ "$outcome" = 'invalid' ]; then
          echo "::warning::Agent output has no usable merge-gate outcome. It will not be applied."
        fi
